# ---------------------------------------------------------------
# Netlify — Sant Hair+ Línea Capilar
#
# El adaptador @astrojs/netlify v8 genera la función SSR en
# .netlify/v1/functions/ssr/ y el payload de despliegue en .netlify/v1/.
# Netlify lo detecta automáticamente, por eso NO se declara la carpeta
# "functions" aquí (eso sobrescribiría la ubicación por defecto).
# ---------------------------------------------------------------

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  NPM_FLAGS = "--no-audit --no-fund"

[build.processing]
  skip_processing = false

# ---------------------------------------------------------------
# Cabeceras de seguridad y cache de los archivos estaticos
# ---------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # La cabecera Content-Security-Policy la emite Astro en cada respuesta,
    # calculando el hash de los scripts y estilos en linea. Asi no hace
    # falta 'unsafe-inline' y el sitio no depende de esta configuracion
    # para protegerse.

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ---------------------------------------------------------------
# Redirecciones
# ---------------------------------------------------------------

# Un solo dominio canonico: sin esto, www y la version sin www sirven
# el mismo contenido y Google lo trata como contenido duplicado.
[[redirects]]
  from = "https://www.santhair.com/*"
  to = "https://santhair.com/:splat"
  status = 301
  force = true

# El sitio es siempre HTTPS.
[[redirects]]
  from = "http://santhair.com/*"
  to = "https://santhair.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.santhair.com/*"
  to = "https://santhair.com/:splat"
  status = 301
  force = true
